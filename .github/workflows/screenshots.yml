name: Capture README screenshots

on:
  workflow_dispatch:
  push:
    branches: [ "claude/admiring-rubin-sqfx88" ]
    paths:
      - "screenshots/**"
      - "PL/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build solution
      run: dotnet build DeliveryApp.sln -c Release

    - name: Build screenshot tool
      run: dotnet build screenshots/screenshots.csproj -c Release "-p:SolutionDir=$env:GITHUB_WORKSPACE\"

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Raise screen resolution
      continue-on-error: true
      run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

    - name: Capture screens
      run: |
        & "$env:GITHUB_WORKSPACE\bin\screenshots.exe" "$env:RUNNER_TEMP\raw"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git checkout -- xml

    - name: Compose framed images and demo video
      run: |
        python -m pip install --quiet pillow imageio-ffmpeg
        python screenshots/compose.py "$env:RUNNER_TEMP\raw" docs/assets

    - uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: |
          docs/assets/*.png
          docs/assets/demo.*

    - name: Commit screenshots
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898+github-actions[bot]@users.noreply.github.com"
        git add docs/assets/*.png docs/assets/demo.gif docs/assets/demo.mp4
        git diff --cached --quiet
        if ($LASTEXITCODE -ne 0) {
          git commit -m "Update README screenshots [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        }
        exit 0
