name: Build & Release DeliveryApp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    # ── 1. Source ──────────────────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ── 2. .NET ────────────────────────────────────────────────────────────────
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # ── 3. Build ───────────────────────────────────────────────────────────────
    - name: Restore dependencies
      run: dotnet restore DeliveryApp.sln

    - name: Build solution (Release)
      run: dotnet build DeliveryApp.sln -c Release --no-restore

    # ── 4. Tests ───────────────────────────────────────────────────────────────
    # The solution builds every project into bin\ (see BaseOutputPath), so run the
    # test from there; `dotnet run --project` looks under \bin\ and never finds it.
    # The test writes to the demo data, so restore xml\ before it is packaged.
    - name: Run integration tests
      run: |
        & "$env:GITHUB_WORKSPACE\bin\uitest.exe" 2>&1
        $code = $LASTEXITCODE
        git checkout -- xml
        exit $code
      continue-on-error: true

    # ── 5. Publish self-contained win-x64 app ─────────────────────────────────
    - name: Publish (self-contained win-x64)
      run: |
        dotnet publish PL/PL.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -o publish/app

    # ── 6. Package ─────────────────────────────────────────────────────────────
    - name: Copy XML data files
      run: |
        New-Item -ItemType Directory -Force -Path "publish/xml" | Out-Null
        Copy-Item "xml/*.xml" "publish/xml/"

    - name: Create DeliveryApp.zip
      run: |
        New-Item -ItemType Directory -Force -Path "release" | Out-Null
        Compress-Archive -Path "publish/*" -DestinationPath "release/DeliveryApp.zip" -Force
        Write-Host "Package ready: release/DeliveryApp.zip"
        (Get-Item "release/DeliveryApp.zip").Length / 1MB | ForEach-Object { Write-Host "Size: $([math]::Round($_, 1)) MB" }

    # ── 7. Upload artifact (available on every run, including PRs) ─────────────
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeliveryApp
        path: release/DeliveryApp.zip

    # ── 8. Publish / update the ONE permanent "latest" release ─────────────────
    #       Only on direct pushes to main (not on PRs).
    - name: Delete existing 'latest' release and tag
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        gh release delete latest --yes 2>$null
        git tag -d latest 2>$null
        git push origin :refs/tags/latest 2>$null
        exit 0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create permanent 'latest' release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "DeliveryApp — Latest"
        make_latest: true
        draft: false
        prerelease: false
        body: |
          ## DeliveryApp — Latest Release

          > This release is always up to date. Every push to `main` rebuilds and replaces this package automatically.

          ---

          ### How to Install

          1. Download **`DeliveryApp.zip`** below.
          2. Extract the ZIP anywhere — you'll get an `app/` folder and an `xml/` folder.
          3. Double-click **`app/DeliveryApp.exe`** — no CMD window, no BAT file, no .NET install needed.

          ---

          ### Demo Login Credentials

          Use these credentials to explore the application.

          | Role | User ID | Password | What you can do |
          |---|---|---|---|
          | **Admin / Manager** | `204857392` | `admin123` | Full dashboard: orders, couriers, clock, config, DB tools |
          | **Courier** | `312458962` | `courier123` | Personal profile, pick orders, deliver, view history |

          > These are intentional public demo credentials for testing. They survive every Reset DB / Init DB.

          ---

          ### Requirements
          - Windows 10 / 11 x64
          - No .NET installation required (self-contained)

          ---

          ### What's Included
          - Auto-generated sequential Order IDs
          - Direct `DeliveryApp.exe` launch (no BAT file, no console window)
          - Themed badge colors throughout the UI
          - Role-based access: Admin and Courier
        files: release/DeliveryApp.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ── 9. Clean up old numbered releases (v2.0.x, v2026.x.x-y, etc.) ─────────
    - name: Clean up old numbered releases
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        $releases = gh release list --limit 50 --json tagName,name | ConvertFrom-Json
        foreach ($r in $releases) {
          $tag = $r.tagName
          # Keep the permanent 'latest' release; delete everything else
          if ($tag -ne "latest") {
            Write-Host "Deleting old release: $tag"
            gh release delete $tag --yes 2>$null
            git push origin :refs/tags/$tag 2>$null
          }
        }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
